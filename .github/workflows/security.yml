name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check:all
      - run: npm test
      - run: node --check server.js
      - run: node --check bridge-jobs.js
      - run: npm audit --omit=dev --audit-level=high

      - name: Linux agent contract test
        working-directory: .
        run: |
          python3 -m py_compile linux-agent/nexora-linux-agent.py
          python3 -m unittest -v linux-agent/test_nexora_linux_agent.py
          bash -n linux-agent/install.sh linux-agent/uninstall.sh
